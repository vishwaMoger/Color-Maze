<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
    <title>Color Maze</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="/src/ui/style.css" />
  </head>
  <body>
    <!--APP-START-->
    <div id="stage"></div>

    <header id="hud-top" class="hud">
      <div class="group">
        <button id="btn-restart" class="clay" aria-label="Restart level" title="Restart (R)">
          <svg viewBox="0 0 24 24"><path d="M4.5 12a7.5 7.5 0 1 0 2.3-5.4" /><path d="M4 4v4.5h4.5" /></svg>
        </button>
        <button id="btn-undo" class="clay" aria-label="Undo move" title="Undo (Z)">
          <svg viewBox="0 0 24 24"><path d="M9 7 4.5 11.5 9 16" /><path d="M5 11.5h9a5 5 0 0 1 0 10h-2" /></svg>
        </button>
      </div>
      <div class="level-info">
        <div id="level-label">Level 1</div>
        <div id="level-dots"></div>
        <div id="moves">Moves <b>0</b></div>
      </div>
      <div class="group right">
        <button id="btn-theme" class="clay" aria-label="Change board" title="Change board">
          <svg viewBox="0 0 24 24"><path d="M12 3.5a8.5 8.5 0 1 0 0 17c1.4 0 2-1 1.5-2.1-.6-1.2.2-2.4 1.6-2.4h2.2a3.2 3.2 0 0 0 3.2-3.3A8.6 8.6 0 0 0 12 3.5Z" /><circle cx="7.5" cy="11" r="1.2" /><circle cx="10.5" cy="7.5" r="1.2" /><circle cx="15" cy="7.8" r="1.2" /></svg>
        </button>
        <button id="btn-sound" class="clay" aria-label="Sound on or off" title="Sound">
          <svg class="on" viewBox="0 0 24 24"><path d="M4 9.5h3.5L12 5.5v13l-4.5-4H4z" /><path d="M15.5 9a4 4 0 0 1 0 6" /><path d="M18 6.5a7.5 7.5 0 0 1 0 11" /></svg>
          <svg class="mute" viewBox="0 0 24 24"><path d="M4 9.5h3.5L12 5.5v13l-4.5-4H4z" /><path d="m16 9.5 5 5" /><path d="m21 9.5-5 5" /></svg>
        </button>
      </div>
      <div class="coins" aria-label="Coins">
        <span class="coin-icon"></span><span id="coins-count">0</span>
      </div>
    </header>

    <div id="tip" hidden>Swipe to roll the ball</div>
    <div id="toast" role="status"></div>

    <footer id="hud-bottom" class="hud">
      <button id="btn-hint" class="clay wide gold" aria-label="Show hint" title="Hint (H)">
        <svg viewBox="0 0 24 24"><path d="M9 18h6" /><path d="M10 21h4" /><path d="M12 3a6 6 0 0 0-3.6 10.8c.6.5 1 1.2 1 2V16h5.2v-.2c0-.8.4-1.5 1-2A6 6 0 0 0 12 3Z" /></svg>
        <span>Hint</span>
      </button>
    </footer>

    <div id="result" hidden>
      <div class="card" role="dialog" aria-labelledby="result-title">
        <h2 id="result-title">Level complete!</h2>
        <div class="stars">
          <span class="star"><svg viewBox="0 0 24 24"><path d="m12 2.8 2.8 5.9 6.4.8-4.7 4.4 1.2 6.3L12 17.1l-5.7 3.1 1.2-6.3-4.7-4.4 6.4-.8Z" /></svg></span>
          <span class="star big"><svg viewBox="0 0 24 24"><path d="m12 2.8 2.8 5.9 6.4.8-4.7 4.4 1.2 6.3L12 17.1l-5.7 3.1 1.2-6.3-4.7-4.4 6.4-.8Z" /></svg></span>
          <span class="star"><svg viewBox="0 0 24 24"><path d="m12 2.8 2.8 5.9 6.4.8-4.7 4.4 1.2 6.3L12 17.1l-5.7 3.1 1.2-6.3-4.7-4.4 6.4-.8Z" /></svg></span>
        </div>
        <p id="result-moves"></p>
        <div class="reward"><span class="coin-icon"></span><span id="result-coins">+0</span></div>
        <button id="btn-next" class="clay wide">Next level</button>
      </div>
    </div>
    <!--APP-END-->
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
