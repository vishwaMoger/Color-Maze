<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
    <title>Color Maze</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="/src/ui/style.css" />
  </head>
  <body>
    <!--APP-START-->
    <div id="stage"></div>

    <div id="splash">
      <div class="logo" aria-label="Color Maze">
        <div class="logo-row"><span style="--c:#ff3d8e">C</span><span style="--c:#ff8a1f">O</span><span style="--c:#ffd21f">L</span><span style="--c:#3fd06a">O</span><span style="--c:#2fb8ff">R</span></div>
        <div class="logo-row maze"><span>M</span><span>A</span><span>Z</span><span>E</span></div>
      </div>
      <div class="loadbar"><span></span></div>
    </div>

    <header id="hud-top" class="hud">
      <div class="group">
        <button id="btn-restart" class="gbtn sq" aria-label="Restart level" title="Restart (R)">
          <svg viewBox="0 0 24 24"><path d="M12 3.2a8.8 8.8 0 1 0 8.5 11h-3.4a5.6 5.6 0 1 1-1.3-5.9l-2.6 2.6h7.6V3.3l-2.6 2.6A8.8 8.8 0 0 0 12 3.2Z" /></svg>
        </button>
        <button id="btn-undo" class="gbtn sq" aria-label="Undo move" title="Undo (Z)">
          <svg viewBox="0 0 24 24"><path d="M9.6 3.6 2.8 10l6.8 6.4v-4h4.2a3.9 3.9 0 0 1 0 7.8h-2.4v3.4h2.4a7.3 7.3 0 0 0 0-14.6H9.6v-5.4Z" /></svg>
        </button>
      </div>
      <div class="level-info">
        <div id="level-progress" class="chain" aria-hidden="true"></div>
        <div id="level-label">Level 1</div>
      </div>
      <div class="group right">
        <button id="btn-theme" class="gbtn sq" aria-label="Boards" title="Boards">
          <svg viewBox="0 0 24 24"><path d="M4.4 10 11 3.4l8 8-6.6 6.6a2.4 2.4 0 0 1-3.4 0L4.4 13.4a2.4 2.4 0 0 1 0-3.4Zm2.7 1.4h9.7L11 5.7Z" /><path d="M20.4 14.4c1.2 1.8 1.8 3.1 1.8 4a1.8 1.8 0 0 1-3.6 0c0-.9.6-2.2 1.8-4Z" /></svg>
        </button>
        <button id="btn-settings" class="gbtn sq" aria-label="Settings" title="Settings">
          <svg viewBox="0 0 24 24"><path fill-rule="evenodd" d="M12 1.8 21 7v10l-9 5.2L3 17V7l9-5.2Zm0 6.1a4.1 4.1 0 1 0 0 8.2 4.1 4.1 0 0 0 0-8.2Z" /></svg>
        </button>
      </div>
      <div class="pill moves-pill" id="moves"></div>
      <div class="pill coins" aria-label="Coins"><span class="coin"></span><span id="coins-count">0</span></div>
    </header>

    <div id="tip" hidden>Swipe to roll the ball</div>
    <div id="toast" role="status"></div>

    <footer id="hud-bottom" class="hud">
      <button id="btn-bomb" class="gbtn tool go" aria-label="Paint bomb: paints three tricky tiles" title="Paint bomb">
        <svg viewBox="0 0 24 24"><path d="M10.6 7.2a7.2 7.2 0 1 0 6.2 3.5l1-1-2.6-2.6-1 1a7.2 7.2 0 0 0-3.6-.9Z" /><path d="M16.9 5.6 18.4 4a1 1 0 0 1 1.5 0l.1.1a1 1 0 0 1 0 1.5l-1.5 1.5Z" /><path d="m21.4 1.2.5 1.2 1.3.2-1 .9.3 1.3-1.1-.7-1.1.7.3-1.3-1-.9 1.3-.2Z" /><circle cx="7.6" cy="11.6" r="1.7" fill-opacity="0.55" /></svg>
        <span class="price" id="bomb-price">FREE</span>
      </button>
      <button id="btn-hint" class="gbtn tool gold" aria-label="Show hint" title="Hint (H)">
        <svg viewBox="0 0 24 24"><path d="M12 1.8a7.4 7.4 0 0 0-4.3 13.4v2.2c0 .7.5 1.2 1.2 1.2h6.2c.7 0 1.2-.5 1.2-1.2v-2.2A7.4 7.4 0 0 0 12 1.8Z" /><path d="M8.9 19.8h6.2v.9c0 .9-.8 1.6-1.7 1.6h-2.8c-.9 0-1.7-.7-1.7-1.6v-.9Z" /></svg>
        <span class="price">FREE</span>
      </button>
    </footer>

    <div id="settings" class="modal" hidden>
      <div class="panel" role="dialog" aria-labelledby="settings-title">
        <div class="ribbon"><span id="settings-title">Settings</span></div>
        <button id="btn-close-settings" class="gbtn round danger close" aria-label="Close settings">
          <svg viewBox="0 0 24 24"><path d="M6.3 4 12 9.7 17.7 4 20 6.3 14.3 12l5.7 5.7-2.3 2.3-5.7-5.7L6.3 20 4 17.7 9.7 12 4 6.3Z" /></svg>
        </button>
        <div class="rows">
          <label class="row"><span>Sound effects</span><button id="tg-sfx" class="toggle" aria-pressed="true"><i></i></button></label>
          <label class="row"><span>Music</span><button id="tg-music" class="toggle" aria-pressed="true"><i></i></button></label>
          <label class="row"><span>Vibration</span><button id="tg-vibe" class="toggle" aria-pressed="true"><i></i></button></label>
        </div>
        <h3>Board</h3>
        <div id="board-list" class="boards"></div>
      </div>
    </div>

    <div id="celebrate" hidden aria-live="polite">
      <div class="stars"><span class="star"><svg viewBox="0 0 24 24"><path class="socket" d="m12 2.6 2.9 6 6.6.8-4.8 4.5 1.2 6.5L12 17.2l-5.9 3.2 1.2-6.5-4.8-4.5 6.6-.8Z" /><path class="fill" d="m12 2.6 2.9 6 6.6.8-4.8 4.5 1.2 6.5L12 17.2l-5.9 3.2 1.2-6.5-4.8-4.5 6.6-.8Z" /></svg></span><span class="star big"><svg viewBox="0 0 24 24"><path class="socket" d="m12 2.6 2.9 6 6.6.8-4.8 4.5 1.2 6.5L12 17.2l-5.9 3.2 1.2-6.5-4.8-4.5 6.6-.8Z" /><path class="fill" d="m12 2.6 2.9 6 6.6.8-4.8 4.5 1.2 6.5L12 17.2l-5.9 3.2 1.2-6.5-4.8-4.5 6.6-.8Z" /></svg></span><span class="star"><svg viewBox="0 0 24 24"><path class="socket" d="m12 2.6 2.9 6 6.6.8-4.8 4.5 1.2 6.5L12 17.2l-5.9 3.2 1.2-6.5-4.8-4.5 6.6-.8Z" /><path class="fill" d="m12 2.6 2.9 6 6.6.8-4.8 4.5 1.2 6.5L12 17.2l-5.9 3.2 1.2-6.5-4.8-4.5 6.6-.8Z" /></svg></span></div>
    </div>

    <div id="result" hidden>
      <div class="rays"></div>
      <div class="card" role="dialog" aria-labelledby="result-title">
        <div class="ribbon big"><span id="result-title">Level Complete!</span></div>
        <div class="stars">
          <span class="star"><svg viewBox="0 0 24 24"><path class="socket" d="m12 2.6 2.9 6 6.6.8-4.8 4.5 1.2 6.5L12 17.2l-5.9 3.2 1.2-6.5-4.8-4.5 6.6-.8Z" /><path class="fill" d="m12 2.6 2.9 6 6.6.8-4.8 4.5 1.2 6.5L12 17.2l-5.9 3.2 1.2-6.5-4.8-4.5 6.6-.8Z" /></svg></span>
          <span class="star big"><svg viewBox="0 0 24 24"><path class="socket" d="m12 2.6 2.9 6 6.6.8-4.8 4.5 1.2 6.5L12 17.2l-5.9 3.2 1.2-6.5-4.8-4.5 6.6-.8Z" /><path class="fill" d="m12 2.6 2.9 6 6.6.8-4.8 4.5 1.2 6.5L12 17.2l-5.9 3.2 1.2-6.5-4.8-4.5 6.6-.8Z" /></svg></span>
          <span class="star"><svg viewBox="0 0 24 24"><path class="socket" d="m12 2.6 2.9 6 6.6.8-4.8 4.5 1.2 6.5L12 17.2l-5.9 3.2 1.2-6.5-4.8-4.5 6.6-.8Z" /><path class="fill" d="m12 2.6 2.9 6 6.6.8-4.8 4.5 1.2 6.5L12 17.2l-5.9 3.2 1.2-6.5-4.8-4.5 6.6-.8Z" /></svg></span>
        </div>
        <p id="result-moves"></p>
        <div class="pill reward"><span class="coin"></span><span id="result-coins">+0</span></div>
        <button id="btn-next" class="gbtn go next">Next</button>
      </div>
    </div>
    <!--APP-END-->
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
